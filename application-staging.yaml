apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: java-secure-pipeline-staging
  namespace: argocd
  labels:
    environment: staging
    team: platform
  annotations:
    notifications.argoproj.io/subscribe.on-deployed.slack: platform-deploys
    notifications.argoproj.io/subscribe.on-health-degraded.slack: platform-alerts
    notifications.argoproj.io/subscribe.on-sync-failed.slack: platform-alerts
spec:
  project: java-secure-pipeline
  source:
    repoURL: oci://123456789012.dkr.ecr.eu-west-2.amazonaws.com/helm-charts
    chart: java-secure-pipeline
    targetRevision: "*"
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml
      parameters:
        - name: image.repository
          value: 123456789012.dkr.ecr.eu-west-2.amazonaws.com/java-secure-pipeline
  destination:
    server: https://kubernetes.default.svc
    namespace: java-pipeline-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  revisionHistoryLimit: 10
